<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Sergio Gracia">
        <title>Ejercicio 4</title>
    </head>

    <body>

        <form action>
            <label>Nombre:</label>
            <input type="text" name="nombre">
            <br>
            <label>Contraseña</label>
            <input type="password" name="contraseña">
            <br>
            <label>Fecha de nacimiento</label>
            <input type="date" name="fecha_nacimiento">
            <br>
            <label>Dirección</label>
            <input type="text" name="dirección">
            <br>
            <label>Sexo</label>
            <input type="radio" name="sexo" value="hombre"> Hombre
            <input type="radio" name="sexo" value="mujer"> Mujer
            <br>
            <label>Color favorito</label>
            <input type="checkbox" name="color" value="Negro"> Negro
            <input type="checkbox" name="color" value="Blanco"> Blanco
            <input type="checkbox" name="color" value="Rosa"> Rosa
            <br>
            <label>Curso</label>
            <select name="curso">
                <option value="Primero">Primero</option>
                <option value="Segundo">Segundo</option>
                <option value="Tercero">Tercero</option>
            </select>
        </form>

    </body>

</html>
